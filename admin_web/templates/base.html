<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Пёс Дата Admin{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1>🐶 Пёс Дата</h1>
      <nav>
        <a href="/" class="{% if active == 'dashboard' %}active{% endif %}">Dashboard</a>
        <a href="/briefs" class="{% if active == 'briefs' %}active{% endif %}">Обращения</a>
        <a href="/bank-payments" class="{% if active == 'bank_payments' %}active{% endif %}">Оплата с р/с</a>
        <a href="/projects" class="{% if active == 'projects' %}active{% endif %}">Проекты</a>
        <a href="/users" class="{% if active == 'users' %}active{% endif %}">Клиенты</a>
        <a href="/chats" class="{% if active == 'chats' %}active{% endif %}">Переписка</a>
        <a href="/payments" class="{% if active == 'payments' %}active{% endif %}">Оплаты ЮKassa</a>
        <a href="/packages" class="{% if active == 'packages' %}active{% endif %}">Пакеты</a>
        <a href="/delivery" class="{% if active == 'delivery' %}active{% endif %}">Отправка контактов</a>
        <a href="/deliveries/history" class="{% if active == 'delivery_history' %}active{% endif %}">История выдач</a>
        <a href="/admin/notifications" class="{% if active == 'admin_notifications' %}active{% endif %}">Уведомления</a>
        <a href="/logout" style="margin-top:24px">Выйти</a>
      </nav>
    </aside>
    <main class="main">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>

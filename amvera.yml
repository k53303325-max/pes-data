# Только Telegram-poller для отдельного приложения на Amvera.
# Админка остаётся на ONREZA (onreza.toml). Не смешивайте два типа приложения в одном проекте Amvera.

meta:
  environment: python
  toolchain:
    name: pip
    version: "3.12"

build:
  requirementsPath: requirements-bot.txt
  useCache: true

run:
  # Тариф «Пробный» (0.1 GB) не хватает — нужен «Начальный» (0.5 GB, ~290 ₽/мес)
  command: env AMVERA=1 PES_DATA_POLLER=1 MALLOC_ARENA_MAX=2 PYTHONDONTWRITEBYTECODE=1 python3 -O scripts/telegram_poller.py
